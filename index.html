<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Experiment 06</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e8f0fe;
      font-family: 'Comic Sans MS', cursive, sans-serif;
    }
    .card {
      background: #fff;
      padding: 50px 60px;
      min-width: 380px;
      max-width: 500px;
      border-radius: 28px;
      text-align: center;
      border: 4px dashed #b8c1ec;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 1.5rem;
      color: #3d5a80;
      margin: 16px 0;
      line-height: 1.4;
    }
    p {
      color: #98c1d9;
      font-size: 1.2rem;
      margin: 0;
      font-weight: bold;
    }
    span {
      font-size: 3.5rem;
      display: inline-block;
      cursor: pointer;
      transition: transform 0.2s;
    }
    span:hover {
      transform: scale(1.25) rotate(8deg);
    }
  </style>
</head>
<body>

  <div class="card">
    <span onclick="this.textContent = this.textContent === '☁️' ? '🌸' : '☁️'">☁️</span>
    <h1>This is my Experiment 06 of Cloud Computing</h1>
    <h2>Hello from ubantu</h2>
    <p>Queency ♡</p>
  </div>

</body>
</html>
